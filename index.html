  /* ---------- объём воды: глубина, блики на дне, искры на поверхности ---------- */
  // тайл «каустики» — светлая сетка, как солнечные зайчики на дне
  var CAUSTIC_SIZE = 192;
  var causticTile = (function () {
    var S = CAUSTIC_SIZE, c = document.createElement("canvas");
    c.width = c.height = S;
    var g = c.getContext("2d"), img = g.createImageData(S, S), d = img.data;
    var rnd = seeded(2024), pts = [];
    for (var i = 0; i < 16; i++) pts.push([rnd() * S, rnd() * S]);
    for (var y = 0; y < S; y++) {
      for (var x = 0; x < S; x++) {
        var f1 = 1e9, f2 = 1e9;
        for (var k = 0; k < pts.length; k++) {
          var dx = Math.abs(x - pts[k][0]), dy = Math.abs(y - pts[k][1]);
          if (dx > S / 2) dx = S - dx;
          if (dy > S / 2) dy = S - dy;
          var dd = dx * dx + dy * dy;
          if (dd < f1) { f2 = f1; f1 = dd; } else if (dd < f2) f2 = dd;
        }
        var edge = Math.sqrt(f2) - Math.sqrt(f1);
        var v = Math.pow(clamp(1 - edge / 9, 0, 1), 2.4);
        var o = (y * S + x) * 4;
        d[o] = 255; d[o + 1] = 255; d[o + 2] = 245; d[o + 3] = Math.round(v * 255);
      }
    }
    g.putImageData(img, 0, 0);
    return c;
  })();
  var causticPattern = null;

  var sparkles = [];
  (function () {
    var rnd = seeded(77);
    for (var i = 0; i < 46; i++) sparkles.push({ x: rnd(), y: rnd(), ph: rnd() * TAU, sp: 0.8 + rnd() * 1.6, len: 5 + rnd() * 10, dx: (rnd() - 0.5) * 0.01 });
  })();

  function shoreLine(left, width, style, alpha) {
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = style;
    ctx.lineWidth = width;
    ctx.lineJoin = "round";
    ctx.beginPath();
    for (var y = -20; y <= H + 20; y += 8) {
      var x = left ? leftW(y) : W - rightW(y);
      if (y === -20) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function drawDepth() {
    var s = shore();
    // светлое мелководье у берегов: песок просвечивает сквозь воду
    for (var side = 0; side < 2; side++) {
      for (var j = 1; j <= 6; j++) {
        shoreLine(side === 0, s * 3.6 * j / 6, colors["water-shallow"], 0.075);
        shoreLine(side === 0, s * 1.8 * j / 6, colors.sand, 0.035);
      }
    }
    // тёмная глубина посередине, множеством мягких слоёв
    var widths = [];
    for (var w = 0.72; w > 0.08; w -= 0.06) widths.push(w);
    for (var i = 0; i < widths.length; i++) {
      ctx.globalAlpha = 0.026;
      ctx.strokeStyle = colors.pebble;
      ctx.lineCap = "round";
      ctx.beginPath();
      for (var y = -40; y <= H + 40; y += 10) {
        var x = waterMidX(clamp(y, 0, H));
        if (y === -40) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      var avg = W - leftW(H / 2) - rightW(H / 2);
      ctx.lineWidth = Math.max(20, avg * widths[i]);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  var bgCache = null, surfCache = null, cacheKey = "";
  var causticCanvas = document.createElement("canvas"), cctx = causticCanvas.getContext("2d");
  var CAUSTIC_DOWN = 3;
  function makeLayer() {
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(W * DPR)); c.height = Math.max(1, Math.round(H * DPR));
    var g = c.getContext("2d"); g.setTransform(DPR, 0, 0, DPR, 0, 0);
    return { c: c, g: g };
  }
  function ensureWaterCaches() {
    var key = W + "x" + H + "@" + DPR + colors["water-deep"] + colors["water-shallow"] + colors.sand;
    if (key === cacheKey && bgCache) return;
    cacheKey = key;
    var saved = ctx;
    var bg = makeLayer(); ctx = bg.g; drawBackgroundStatic(); drawDepth(); bgCache = bg.c;
    var sf = makeLayer(); ctx = sf.g;
    ctx.globalAlpha = 0.1; ctx.fillStyle = colors["water-deep"]; ctx.fillRect(0, 0, W, H);
    var gr = ctx.createLinearGradient(0, 0, W * 0.8, H);
    gr.addColorStop(0, "rgba(255, 255, 255, 0.22)");
    gr.addColorStop(0.35, "rgba(255, 255, 255, 0)");
    gr.addColorStop(0.7, "rgba(255, 255, 255, 0)");
    gr.addColorStop(1, "rgba(255, 255, 255, 0.1)");
    ctx.globalAlpha = 1; ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
    surfCache = sf.c;
    ctx = saved;
    causticCanvas.width = Math.ceil(W / CAUSTIC_DOWN); causticCanvas.height = Math.ceil(H / CAUSTIC_DOWN);
    causticPattern = cctx.createPattern(causticTile, "repeat");
  }

  function drawCaustics() {
    var light = (1 - 0.85 * nightLevel);
    if (light < 0.05) return;
    var cw = causticCanvas.width, ch = causticCanvas.height;
    cctx.clearRect(0, 0, cw, ch);
    var layers = [
      { k: 1.6, vx: 9, vy: 5, a: 0.17 },
      { k: 2.3, vx: -6, vy: 8, a: 0.12 }
    ];
    for (var i = 0; i < layers.length; i++) {
      var L = layers[i], span = CAUSTIC_SIZE * L.k;
      var ox = ((time * L.vx) % span + span) % span, oy = ((time * L.vy) % span + span) % span;
      // лёгкое «дыхание», чтобы сетка переливалась
      var wob = 1 + Math.sin(time * 0.6 + i * 2) * 0.03, k = L.k * wob / CAUSTIC_DOWN;
      cctx.setTransform(k, 0, 0, k, (ox - span) / CAUSTIC_DOWN, (oy - span) / CAUSTIC_DOWN);
      cctx.globalAlpha = L.a;
      cctx.fillStyle = causticPattern;
      cctx.fillRect(0, 0, (cw + span * 2 / CAUSTIC_DOWN) / k, (ch + span * 2 / CAUSTIC_DOWN) / k);
    }
    cctx.setTransform(1, 0, 0, 1, 0, 0);
    cctx.globalAlpha = 1;
    ctx.globalAlpha = light;
    ctx.drawImage(causticCanvas, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // поверхность: жители видны сквозь толщу воды, по глади бегут блики
  function drawSurface() {
    ctx.globalAlpha = 1 - 0.5 * nightLevel;
    ctx.drawImage(surfCache, 0, 0, W, H);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    var power = 1 - 0.75 * nightLevel;
    for (var i = 0; i < sparkles.length; i++) {
      var sp = sparkles[i];
      var tw = Math.sin(time * sp.sp + sp.ph);
      if (tw <= 0.55) continue;
      var x = ((sp.x + time * sp.dx) % 1 + 1) % 1 * W, y = sp.y * H;
      if (!inWater(x, y, 6)) continue;
      var k = Math.pow((tw - 0.55) / 0.45, 2) * power;
      ctx.globalAlpha = 0.75 * k;
      ctx.fillStyle = "#FFFFFF";
      ctx.beginPath();
      ctx.ellipse(x, y, sp.len * (0.6 + 0.4 * k), 1.2 + k, -0.35, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  function draw() {
    drawBackground();
    drawCaustics();
    drawFood(false);
    for (var i = 0; i < axos.length; i++) drawAxo(axos[i]);
    for (i = 0; i < fishes.length; i++) drawFish(fishes[i]);
    drawSurface();
    drawRipples();
    drawPads();
    drawFood(true);
    drawCritters();
    drawDucks(false);
    drawShore();
    for (i = 0; i < roses.length; i++) drawRose(roses[i]);
    for (i = 0; i < feeders.length; i++) drawFeeder(feeders[i]);
    drawJumps();
    for (i = 0; i < birds.length; i++) if (birds[i].state === "perch") drawBird(birds[i]);
    drawSky();
    for (i = 0; i < birds.length; i++) if (birds[i].state !== "perch") drawBird(birds[i]);
    drawDucks(true);
  }

  var last = 0;
  function frame(now) {
    var dt = Math.min(0.05, (now - last) / 1000 || 0);
    last = now;
    if (!paused) {
      time += dt;
      for (var i = 0; i < axos.length; i++) updateAxo(axos[i], dt);
      for (i = 0; i < fishes.length; i++) updateFish(fishes[i], dt);
      updateCritters(dt);
      updateSky(dt);
      updateBirds(dt);
      updateDucks(dt);
      for (i = foods.length - 1; i >= 0; i--) {
        foods[i].life -= dt;
        if (foods[i].life <= 0) foods.splice(i, 1);
      }
      for (i = ripples.length - 1; i >= 0; i--) {
        ripples[i].t += dt * 0.9;
        if (ripples[i].t >= 1.25) ripples.splice(i, 1);
      }
      draw();
    }
    requestAnimationFrame(frame);
  }

  function setPaused(p) {
    paused = p;
    pauseBtn.textContent = paused ? "▶" : "⏸";
    pauseBtn.setAttribute("aria-label", paused ? "Продолжить" : "Пауза");
    if (paused) draw();
  }

  /* ---------- события ---------- */
  /* ---------- украшение ---------- */
  var decorMode = false;
  var tool = "pad";
  var hintTimer = 0;
  var HINTS = {
    feed: "Нажмите на воду или кувшинку, чтобы бросить корм.",
    pad: "Нажмите на воду, чтобы посадить кувшинку.",
    rose: "Нажмите на берег, чтобы посадить розовый куст.",
    feeder: "Нажмите на берег, чтобы поставить кормушку. К ней будут прилетать птицы и утки.",
    frog: "Нажмите на кувшинку, чтобы посадить на неё лягушку.",
    snail: "Нажмите на кувшинку, чтобы посадить на неё улитку.",
    remove: "Нажмите на жителя пруда или украшение, чтобы убрать."
  };
  var MODE_LABELS = {
    pad: "Сажаем кувшинки",
    rose: "Сажаем розовые кусты",
    feeder: "Ставим кормушки",
    frog: "Сажаем лягушек",
    snail: "Сажаем улиток",
    remove: "Удаляем"
  };
  var modeOpener = null;
  function restoreHint() { hintEl.textContent = decorMode ? HINTS[tool] : HINTS.feed; }
  function flash(msg) {
    hintEl.textContent = msg;
    clearTimeout(hintTimer);
    hintTimer = setTimeout(restoreHint, 2600);
  }
  function closeMenus() {
    addMenu.hidden = true;
    decorMenu.hidden = true;
    addBtn.setAttribute("aria-expanded", "false");
    decorBtn.setAttribute("aria-expanded", "false");
  }
  function toggleMenu(menu, btn) {
    var open = menu.hidden;
    closeMenus();
    if (open) {
      menu.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      menu.querySelector("button:not(:disabled)").focus();
    }
  }
  function enterMode(t, opener) {
    if ((t === "frog" || t === "snail") && !pads.length) {
      closeMenus();
      flash("Сначала посадите кувшинку: лягушки и улитки живут на кувшинках.");
      return;
    }
    closeMenus();
    tool = t;
    decorMode = true;
    modeOpener = opener || null;
    mainControls.hidden = true;
    modeControls.hidden = false;
    modeLabel.textContent = MODE_LABELS[t];
    canvas.style.cursor = t === "remove" ? "pointer" : "copy";
    clearTimeout(hintTimer);
    restoreHint();
    doneBtn.focus();
  }
  function exitMode() {
    decorMode = false;
    mainControls.hidden = false;
    modeControls.hidden = true;
    canvas.style.cursor = "crosshair";
    clearTimeout(hintTimer);
    restoreHint();
    (modeOpener || addBtn).focus();
    saveSoon();
  }

  function padRadius(p) { return p.r * Math.min(Math.min(W, H) * 1.3, 1000); }

  function handleDecor(x, y) {
    if (tool === "pad") {
      if (!inWater(x, y, 10)) { flash("Кувшинки растут только на воде."); return; }
      if (pads.length >= MAX_PADS) { flash("Кувшинок уже достаточно. Уберите одну, чтобы посадить новую."); return; }
      pads.push(makePad(x / W, y / H, rand(0.055, 0.1), rand(0, TAU)));
      ripples.push({ x: x, y: y, t: 0, max: 40 });
    } else if (tool === "frog" || tool === "snail") {
      var pad = findPadAt(x, y);
      var who = tool === "frog" ? "лягушку" : "улитку";
      if (!pad) { flash("Посадить " + who + " можно только на кувшинку."); return; }
      if (tool === "frog") {
        if (pad.frog || pad.reserved) { flash("На этой кувшинке уже сидит лягушка."); return; }
        pad.frog = makeFrog();
      } else {
        if (pad.snails.length >= MAX_SNAILS_PER_PAD) { flash("На этой кувшинке уже две улитки, им тесно."); return; }
        var sn = makeSnail(Math.floor(rand(0, SNAIL_SHELLS.length)));
        if (pad.snails.length) sn.ang = pad.snails[0].ang + Math.PI;
        pad.snails.push(sn);
      }
      var pp = padPos(pad);
      ripples.push({ x: pp.x, y: pp.y, t: 0, max: 26 });
    } else if (tool === "feeder") {
      if (!onShore(x, y)) { flash("Кормушку ставим на берег, а не в воду."); return; }
      if (feeders.length >= MAX_FEEDERS) { flash("Трёх кормушек птицам хватит."); return; }
      feeders.push({ x: x / W, y: y / H, seed: Math.floor(rand(1, 2147483647)) });
      birdTimer = Math.min(birdTimer, rand(2, 4));
      if (!ducks) duckTimer = Math.min(duckTimer, rand(10, 18));
    } else if (tool === "rose") {
      if (!onShore(x, y)) { flash("Розы растут только на берегу, по краю пруда."); return; }
      if (roses.length >= MAX_ROSES) { flash("На берегу больше нет места. Уберите куст, чтобы посадить новый."); return; }
      roses.push({ x: x / W, y: y / H, s: rand(0.5, 0.62), seed: Math.floor(rand(1, 2147483647)), c: Math.floor(rand(0, ROSE_COLORS.length)) });
    } else {
      var best = -1, kind = null, bd = Infinity, i, d;
      for (i = 0; i < feeders.length; i++) {
        d = Math.hypot(feeders[i].x * W - x, feeders[i].y * H - y);
        if (d < feederSize() * 0.8 && d < bd) { bd = d; best = i; kind = "feeder"; }
      }
      if (kind === null) {
        for (i = 0; i < roses.length; i++) {
          d = Math.hypot(roses[i].x * W - x, roses[i].y * H - y);
          if (d < roses[i].s * shore() * 1.1 && d < bd) { bd = d; best = i; kind = "rose"; }
        }
      }
      var hitPad = kind === null ? findPadAt(x, y) : null;
      var hitFish = -1, hitAxo = -1;
      if (kind === null && !(hitPad && (hitPad.frog || hitPad.snails.length))) {
        // рыбки и аксолотли под пальцем (ищем ближайших)
        bd = Infinity;
        for (i = 0; i < fishes.length; i++) {
          d = Math.hypot(fishes[i].x - x, fishes[i].y - y);
          if (d < fishes[i].len * 0.6 + 10 && d < bd) { bd = d; hitFish = i; }
        }
        for (i = 0; i < axos.length; i++) {
          var pts = axos[i].pts, hr = axos[i].size * 0.16 + 8;
          for (var j = 0; j < N * 0.8; j += 2) {
            d = Math.hypot(pts[j].x - x, pts[j].y - y);
            if (d < hr && d < bd) { bd = d; hitAxo = i; hitFish = -1; }
          }
        }
      }
      if (kind === "feeder") feeders.splice(best, 1);
      else if (kind === "rose") roses.splice(best, 1);
      else if (hitAxo >= 0) {
        var h0 = axos[hitAxo].pts[0];
        ripples.push({ x: h0.x, y: h0.y, t: 0, max: 30 });
        axos.splice(hitAxo, 1);
        flash("Аксолотль уплыл.");
      }
      else if (hitFish >= 0) {
        ripples.push({ x: fishes[hitFish].x, y: fishes[hitFish].y, t: 0, max: 24 });
        fishes.splice(hitFish, 1);
        flash("Рыбка уплыла.");
      }
      else if (hitPad) {
        // сначала лягушка, потом улитки, потом сама кувшинка
        if (hitPad.frog) hitPad.frog = null;
        else if (hitPad.snails.length) hitPad.snails.pop();
        else {
          pads.splice(pads.indexOf(hitPad), 1);
          foods = foods.filter(function (f) { return f.pad !== hitPad; });
          jumps = jumps.filter(function (jm) {
            if (jm.to === hitPad) { jm.from.frog = jm.from.frog || jm.frog; return false; }
            return true;
          });
        }
      }
      else { flash("Здесь нечего убирать."); return; }
    }
    updateCount();
    saveSoon();
  }

  /* ---------- сохранение ---------- */
  var LS_KEY = "axolotl-pond-v1";
  var lastJson = null;
  var localSavedAt = 0;
  var remote = null;
  var writing = false;
  var pendingRemote = null;
  var saveTimer = 0;

  function r4(v) { return Math.round(v * 10000) / 10000; }
  function snapshotState() {
    return {
      v: 1,
      sky: skyMode,
      axos: axos.map(function (ax) {
        return { vi: ax.vi, k: r4(ax.k), x: r4(ax.pts[0].x / W), y: r4(ax.pts[0].y / H), a: r4(ax.a % TAU) };
      }),
      fishes: fishes.map(function (f) {
        return { vi: f.vi, len: r4(f.len), x: r4(f.x / W), y: r4(f.y / H), a: r4(f.a % TAU) };
      }),
      pads: pads.map(function (p) {
        var o = { x: r4(p.x), y: r4(p.y), r: r4(p.r), rot: r4(p.rot) };
        var hasFrog = !!p.frog || jumps.some(function (jm) { return jm.to === p; });
        if (hasFrog) o.frog = 1;
        if (p.snails.length) o.snails = p.snails.map(function (sn) { return sn.c; });
        return o;
      }),
      roses: roses.map(function (b) { return { x: r4(b.x), y: r4(b.y), s: r4(b.s), seed: b.seed, c: b.c }; }),
      feeders: feeders.map(function (f) { return { x: r4(f.x), y: r4(f.y), seed: f.seed }; })
    };
  }

  function inside01(v) { return clamp(num(v, 0.5), -0.1, 1.1); }
  function applyState(st) {
    if (!st || typeof st !== "object") return false;
    var list = function (v) { return Array.isArray(v) ? v : []; };
    axos = list(st.axos).slice(0, MAX_AXOS).map(function (o) {
      return makeAxo(inside01(o.x) * W, inside01(o.y) * H, o.vi, clamp(num(o.k, 1), 0.6, 1.3), o.a);
    });
    fishes = list(st.fishes).slice(0, MAX_FISH).map(function (o) {
      return makeFish(inside01(o.x) * W, inside01(o.y) * H, o.vi, o.len, o.a);
    });
    jumps = [];
    pads = list(st.pads).slice(0, MAX_PADS).map(function (o) {
      var p = makePad(inside01(o.x), inside01(o.y), clamp(num(o.r, 0.08), 0.03, 0.14), num(o.rot, 0));
      if (o.frog) p.frog = makeFrog();
      p.snails = list(o.snails).slice(0, MAX_SNAILS_PER_PAD).map(function (c) { return makeSnail(num(c, 0)); });
      return p;
    });
    setSky(typeof st.sky === "string" ? st.sky : "auto");
    updateSky(0, true);
    roses = list(st.roses).slice(0, MAX_ROSES).map(function (o) {
      return { x: inside01(o.x), y: inside01(o.y), s: clamp(num(o.s, 0.5), 0.3, 0.7), seed: Math.abs(num(o.seed, 1) | 0) || 1, c: Math.abs(num(o.c, 0) | 0) };
    });
    feeders = list(st.feeders).slice(0, MAX_FEEDERS).map(function (o) {
      return { x: inside01(o.x), y: inside01(o.y), seed: Math.abs(num(o.seed, 7) | 0) || 7 };
    });
    birds = [];
    ducks = null;
    birdTimer = rand(3, 6);
    duckTimer = rand(15, 30);
    foods = [];
    lastJson = JSON.stringify(snapshotState());
    updateCount();
    if (paused) draw();
    return true;
  }

  function writeRemote(st) {
    if (!remote) return;
    pendingRemote = st;
    if (writing) return;
    writing = true;
    (function next() {
      var body = pendingRemote;
      pendingRemote = null;
      remote.set(body).then(null, function (e) {
        var code = e && e.code;
        if (code !== "unavailable" && code !== "resource_exhausted") remote = null;
      }).then(function () {
        if (pendingRemote && remote) next(); else writing = false;
      });
    })();
  }

  function persist(force) {
    if (guest) return;
    var st = snapshotState();
    var json = JSON.stringify(st);
    if (!force && json === lastJson) return;
    lastJson = json;
    st.savedAt = Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify(st)); } catch (e) { /* хранилище недоступно */ }
    writeRemote(st);
  }
  function saveSoon() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () { persist(false); }, 700);
  }

  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return false;
      var st = JSON.parse(raw);
      if (applyState(st)) { localSavedAt = num(st.savedAt, 0); return true; }
    } catch (e) { /* нет сохранения */ }
    return false;
  }

  function withTimeout(p, ms) {
    return new Promise(function (resolve, reject) {
      var t = setTimeout(function () { reject({ code: "timeout" }); }, ms);
      p.then(function (v) { clearTimeout(t); resolve(v); }, function (e) { clearTimeout(t); reject(e); });
    });
  }

  function connectRemote() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") return;
    var db;
    Promise.all([c.use("db"), c.use("user")]).then(function (res) {
      db = res[0];
      var user = res[1];
      if (!db || !user) throw { code: "absent" };
      return user.id();
    }).then(function (id) {
      if (!id) throw { code: "no-user" };
      var ref = db.collection("data/users/" + id).doc("pond");
      return withTimeout(ref.get(), 10000).then(function (snap) {
        remote = ref;
        var d = snap.exists ? snap.data() : null;
        if (guest) return;
        if (d && num(d.savedAt, 0) > localSavedAt) {
          applyState(d);
          try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (e) { /* ничего */ }
        } else {
          persist(true);
        }
      });
    }).then(null, function () { remote = null; });
  }

  /* ---------- события ---------- */
  canvas.addEventListener("pointerdown", function (e) {
    var rect = canvas.getBoundingClientRect();
    var x = e.clientX - rect.left, y = e.clientY - rect.top;
    if (!musicPanel.hidden) { setMusicPanel(false); return; }
    if (!addMenu.hidden || !decorMenu.hidden) { closeMenus(); return; }
    if (decorMode) handleDecor(x, y);
    else if (inWater(x, y)) dropFood(x, y);
    if (paused) draw();
  });
  var MENU_KEY = "zen-pond-menu-open";
  function setMenuOpen(open, remember) {
    if (!open) closeMenus();
    mainRow.hidden = !open;
    menuToggle.setAttribute("aria-expanded", open ? "true" : "false");
    menuToggle.textContent = open ? "✕ Свернуть" : "☰ Меню";
    if (remember) { try { localStorage.setItem(MENU_KEY, open ? "1" : "0"); } catch (e) { /* ничего */ } }
  }
  menuToggle.addEventListener("click", function () { setMenuOpen(mainRow.hidden, true); });
  try { setMenuOpen(localStorage.getItem(MENU_KEY) === "1", false); } catch (e) { setMenuOpen(false, false); }
  addBtn.addEventListener("click", function () { toggleMenu(addMenu, addBtn); });
  decorBtn.addEventListener("click", function () { toggleMenu(decorMenu, decorBtn); });
  removeBtn.addEventListener("click", function () { enterMode("remove", removeBtn); });
  doneBtn.addEventListener("click", exitMode);
  modeBtns.forEach(function (b) {
    var opener = addMenu.contains(b) ? addBtn : decorBtn;
    b.addEventListener("click", function () { enterMode(b.getAttribute("data-mode"), opener); });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    if (!musicPanel.hidden) { setMusicPanel(false); musicBtn.focus(); return; }
    if (!addMenu.hidden) { closeMenus(); addBtn.focus(); }
    else if (!decorMenu.hidden) { closeMenus(); decorBtn.focus(); }
    else if (decorMode) exitMode();
  });
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden") persist(false);

    if (navigator.share) {
      navigator.share({ title: "Мой Дзен пруд", text: "Загляни в мой Дзен пруд 🦎", url: url }).then(null, function (e) {
        if (!e || e.name !== "AbortError") copyIt();
      });
    } else {
      copyIt();
    }
  });

  window.addEventListener("resize", resize);
  var mq = window.matchMedia("(prefers-color-scheme: dark)");
  var onTheme = function () { readColors(); if (paused) draw(); };
  if (mq.addEventListener) mq.addEventListener("change", onTheme);
  new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  /* ---------- запуск ---------- */
  readColors();
  setSky("auto");
  updateSky(0, true);
  resize();
  if (!loadLocal()) {
    for (i = 0; i < 5; i++) addAxo(false);
    lastJson = JSON.stringify(snapshotState());
  }
  updateCount();
  openShared();
  connectRemote();
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setPaused(true);
  }
  requestAnimationFrame(function (t) { last = t; draw(); requestAnimationFrame(frame); });
})();
</script>
